<label>
  Registration type
  <select name="registration_mode" data-registration-mode>
    <option value="team">Register a team</option>
    <option value="solo">Register alone</option>
  </select>
</label>
<div class="stack-form" data-team-fields>
  <label>
    Team name
    <input type="text" name="team_name" required>
  </label>
  <label>
    Member email addresses ({{ 'optional, up to ' if emails_optional|default(false) else '' }}{{ tournament.team_size }} members)
    <textarea name="member_emails" rows="3" placeholder="alex@example.com, sam@example.com" {% if not emails_optional|default(false) %}required{% endif %}></textarea>
  </label>
  <label>
    Average Elo
    <input type="number" name="average_elo" min="0" max="4000" step="1" required>
  </label>
</div>
<div class="stack-form" data-solo-fields hidden>
  <label>
    Your name
    <input type="text" name="name" autocomplete="name" required disabled>
  </label>
  <label>
    Your email{{ ' (optional)' if emails_optional|default(false) else '' }}
    <input type="email" name="email" autocomplete="email" {% if not emails_optional|default(false) %}required{% endif %} disabled>
  </label>
  <label>
    Approximate Elo (optional)
    <input type="number" name="approximate_elo" min="0" max="4000" step="1" disabled>
  </label>
</div>
