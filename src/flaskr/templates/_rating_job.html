{% if rating_job and rating_job.status != 'completed' %}
<section class="rating-job flash flash-{{ 'warning' if rating_job.status == 'failed' else 'info' }}" data-rating-job data-status-url="{{ url_for('web.admin_rating_status') }}" data-version="{{ rating_job.requested_version }}" data-status="{{ rating_job.status }}" aria-live="polite">
  <strong>Rating update</strong>
  <p data-rating-job-message>{{ rating_job.message if rating_job else '' }}</p>
  <a href="{{ url_for('web.admin', tab='rating') }}">Open Rating</a>
  <form method="post" action="{{ url_for('web.admin_rebuild_ratings') }}" data-rating-retry {% if not rating_job or rating_job.status != 'failed' %}hidden{% endif %}>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="secondary tiny">Retry rating rebuild</button>
  </form>
</section>
{% endif %}
